version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # react y react-dom deben ir siempre con la misma versión
      react:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
